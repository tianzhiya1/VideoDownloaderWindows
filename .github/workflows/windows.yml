name: Windows Video App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-video-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Set up Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build Windows application
        shell: pwsh
        run: |
          $deno = (Get-Command deno).Source
          pyinstaller --noconfirm --clean --windowed --name VideoDownloader --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --add-binary "$deno;." main.py

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VideoDownloader -DestinationPath VideoDownloader-Windows-x64.zip -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows-x64
          path: VideoDownloader-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "v1.5.0"
          if (gh release view $version --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload $version VideoDownloader-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create $version VideoDownloader-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --title "VideoDownloader Windows $version" --notes "Adds yt-dlp-powered YouTube and supported-site media extraction. Deno JS runtime is bundled for YouTube player challenge support. No DRM or paywall bypass."
          }
