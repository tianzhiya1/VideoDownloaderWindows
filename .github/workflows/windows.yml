name: Windows Video App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-video-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --windowed --name VideoDownloader main.py

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VideoDownloader -DestinationPath VideoDownloader-Windows-x64.zip -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Windows-x64
          path: VideoDownloader-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if (gh release view v1.0.0 --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload v1.0.0 VideoDownloader-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create v1.0.0 VideoDownloader-Windows-x64.zip --repo "$env:GITHUB_REPOSITORY" --title "VideoDownloader Windows v1.0.0" --notes "Independent Windows video media URL extractor."
          }
